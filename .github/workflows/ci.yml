name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  frontend:
    name: Frontend Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/web

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/web/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Run Linter
      run: npm run lint

    - name: Type Check
      run: npx tsc --noEmit

    - name: Run Tests
      run: npx vitest run

    - name: Build
      run: npm run build
      env:
        VITE_API_BASE_URL: /api
        VITE_REALTIME_PROVIDER: sse

    - name: Docker Build Test
      run: docker build -t counterguard-frontend -f Dockerfile.prod .

  backend:
    name: Backend Formatting & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: pip install -r requirements.txt

    - name: Test (Placeholder)
      run: echo "Run Pytest here"

    - name: Docker Build Test
      working-directory: .
      run: docker build -t counterguard-backend -f backend/Dockerfile .
