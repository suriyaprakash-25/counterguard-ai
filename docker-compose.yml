version: "3.8"

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: counterguard-backend
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=counterguard123
      - CHROMADB_PATH=/app/chroma_db
    depends_on:
      - neo4j
    volumes:
      - ./data:/app/data
      - ./chroma_db:/app/chroma_db

  frontend:
    build:
      context: ./frontend/web
      dockerfile: Dockerfile
    container_name: counterguard-frontend
    ports:
      - "80:80"
    depends_on:
      - backend

  neo4j:
    image: neo4j:5.15-community
    container_name: counterguard-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/counterguard123
    volumes:
      - neo4j_data:/data

volumes:
  neo4j_data:
