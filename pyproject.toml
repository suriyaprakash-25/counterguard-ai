[tool.poetry]
name = "counterguard"
version = "0.1.0"
description = "Autonomous Counterfeit & Grey-Market Intelligence Network"
authors = ["CounterGuard Team"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "C90"]
ignore = ["E501"]

[tool.pytest.ini_options]

minversion = "7.0"
addopts = "-ra -q -p no:warnings"
asyncio_mode = "auto"
testpaths = [
    "backend/tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]
